name: pr476 scheduler diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    name: Windows diagnostics (${{ matrix.sample }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Record runner capacity
        run: node -e "const os=require('node:os'); console.log(JSON.stringify({node:process.version,cpus:os.cpus().length,parallelism:os.availableParallelism(),memory:os.totalmem()}))"
      - name: rush update
        run: node common/scripts/install-run-rush.js update
      - name: rush build
        run: node common/scripts/install-run-rush.js build
      - name: rush built CLI smoke
        run: node common/scripts/install-run-rush.js smoke-built-cli
      - name: rush typecheck
        run: node common/scripts/install-run-rush.js typecheck
      - name: rush typecheck tests
        run: node common/scripts/install-run-rush.js typecheck:tests
      - name: rush lint
        run: node common/scripts/install-run-rush.js lint
      - name: Install Codex for protocol checks
        run: |
          npm install --global @openai/codex@latest
          codex --version
      - name: Full workspace tests with original concurrency
        run: node common/scripts/install-run-rush.js test
      - name: Print complete host test output
        if: always()
        shell: pwsh
        run: |
          $logRoot = 'packages/dreamux/.rush/temp/chunked-rush-logs'
          if (Test-Path -LiteralPath $logRoot) {
            Get-ChildItem -LiteralPath $logRoot -Filter '*.test.chunks.jsonl' | ForEach-Object {
              Get-Content -LiteralPath $_.FullName | ForEach-Object {
                $record = $_ | ConvertFrom-Json
                Write-Output $record.text
              }
            }
          }
