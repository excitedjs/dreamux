# Promote `next` into `main` with a strict fast-forward-only merge.
#
# This workflow is the operator-controlled gate between the prerelease
# (beta) channel and the stable (latest) channel. It is deliberately
# manual-only: the operator decides when a beta that has lived on `next`
# for long enough is stable enough to ship as the default `latest` npm
# dist-tag. No automatic trigger, no schedule, no PR merge button can
# invoke it.
#
# Behavior:
#   1. Fetch both main and next at full depth.
#   2. Fail hard if `main` is NOT a direct ancestor of `next`. A
#      non-linear topology (e.g. a hotfix landed directly on main)
#      means the operator must first reconcile it before promoting;
#      silently producing a merge commit here would break the
#      invariant that main is a strict prefix of next.
#   3. `git checkout main && git merge --ff-only origin/next`.
#      Fast-forward-only is the ONLY allowed merge shape. Squash,
#      rebase, and true merge commits all rewrite commit metadata on
#      main and would drop the link between a beta.<run_number> publish
#      and the exact commit that shipped as stable.
#   4. Push the fast-forwarded main back to origin over SSH with the
#      release deploy key. The `release-branch-pr-gate` repository ruleset
#      requires pull requests on main/next for every ordinary actor and
#      GitHub cannot grant the Actions app a bypass, so the ruleset lists
#      deploy keys as its bypass actor and this push authenticates as the
#      repository's release deploy key instead of GITHUB_TOKEN.
#   5. A deploy-key push is an ordinary push, so `on.push.main` in
#      release.yml fires by itself — no explicit dispatch step. (The old
#      GITHUB_TOKEN push was invisible to other workflows under GitHub's
#      anti-infinite-loop guard and needed a manual `gh workflow run`
#      nudge.) If the promoted HEAD commit message ever contains
#      [skip ci], or the auto-triggered run must be retried, dispatch
#      release.yml against main by hand — manual dispatch remains the
#      documented retry hook.
#
# Push identity:
#   The Actions secret RELEASE_DEPLOY_KEY holds the private half of the
#   read-write repository deploy key "release-pipeline"; its public half
#   is registered on this repository and the ruleset lists deploy keys as
#   bypass actors. The workflow fails loudly when the secret is missing.
#   GITHUB_TOKEN stays contents:read — nothing here pushes with it.
#
# Operator usage:
#   Actions → promote-next → Run workflow → Run (no inputs).
#   A single click drives the whole stable-release path:
#     topo guard → ff merge → deploy-key push main → release.yml
#     on.push → version job → publish → npm `latest`.

name: promote-next

on:
  workflow_dispatch:

concurrency:
  group: promote-next
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    name: fast-forward main to next
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # topology check + ff merge need the full graph
          ref: main

      - name: ensure local refs exist for both branches
        run: |
          set -euo pipefail
          git show-ref --verify --quiet refs/remotes/origin/main || {
            echo "::error::origin/main ref missing; aborting."
            exit 1
          }
          git show-ref --verify --quiet refs/remotes/origin/next || {
            echo "::error::origin/next ref missing; aborting."
            exit 1
          }

      - name: topology guard — main MUST be a direct ancestor of next
        id: topo
        run: |
          set -euo pipefail
          main_sha=$(git rev-parse origin/main)
          next_sha=$(git rev-parse origin/next)
          echo "main_sha=$main_sha"
          echo "next_sha=$next_sha"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "next_sha=$next_sha" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$main_sha" "$next_sha"; then
            echo "Topology OK: main is an ancestor of next — fast-forward is valid."
            echo "linear=true" >> "$GITHUB_OUTPUT"
          else
            base=$(git merge-base "$main_sha" "$next_sha")
            echo "::error::Topology violation: origin/main is NOT a direct ancestor of origin/next."
            echo "::error::merge-base (divergence point) = $base"
            echo "::error::This means a commit landed on main without going through next."
            echo "::error::Resolve the divergence (cherry-pick / re-anchor next) before running promote-next."
            # Human-readable debug for the operator
            echo ""
            echo "--- Commits on main but NOT on next ---"
            git --no-pager log --oneline "${base}..origin/main" || true
            echo ""
            echo "--- Commits on next but NOT on main ---"
            git --no-pager log --oneline "${base}..origin/next" || true
            exit 1
          fi

      - name: fast-forward main to next
        id: ff
        run: |
          set -euo pipefail
          before=$(git rev-parse HEAD)
          # checkout main explicitly; we already started on main but guard anyway
          git checkout main
          # --ff-only: produce a merge commit is never acceptable.
          git merge --ff-only origin/next
          after=$(git rev-parse HEAD)
          echo "before=$before"
          echo "after =$after"
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after"   >> "$GITHUB_OUTPUT"
          if [ "$before" = "$after" ]; then
            echo "Note: main was already equal to next (nothing to promote)."
            echo "noop=true" >> "$GITHUB_OUTPUT"
          else
            echo "noop=false" >> "$GITHUB_OUTPUT"
          fi

      - name: set up release deploy key (ruleset bypass push identity)
        if: steps.ff.outputs.noop != 'true'
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_DEPLOY_KEY}" ]; then
            echo "::error::RELEASE_DEPLOY_KEY secret is missing; the ruleset-protected main branch cannot be pushed without the release deploy key."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${RELEASE_DEPLOY_KEY}" > ~/.ssh/release_deploy_key
          chmod 600 ~/.ssh/release_deploy_key
          # Pin GitHub's SSH host keys from the meta API instead of trusting
          # first use.
          curl -fsS https://api.github.com/meta \
            | jq -r '.ssh_keys[] | "github.com " + .' > ~/.ssh/release_known_hosts

      - name: push main to origin (deploy key)
        if: steps.ff.outputs.noop != 'true'
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/release_deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/release_known_hosts
        run: |
          set -euo pipefail
          git push "git@github.com:${GITHUB_REPOSITORY}.git" main
          echo "Pushed main → origin via the release deploy key."
          echo "release.yml triggers on this push by itself (deploy-key pushes are visible to on.push)."
